; registration on multiple CSEs

[general]
host = localhost

[notifications]
interface = 0.0.0.0
port = 9999
endpoint = /authorize
httpAddress = http://${general:host}:${port}

[rules]
; Directory containing the access control rule files: "_common.yaml" (applied to
; every CSE) plus one "<cseId>.yaml" file per CSE (without the leading "/").
path = rules
; How often (in seconds) to check the rule files for changes and reload them.
; 0 disables reloading (rules are only read once, at startup).
reloadInterval = 10

[cse.id-in]
cseId = id-in
releaseVersion = 5
httpAddress = http://localhost:8080
aeResourceName = das
aeAppId = N${aeResourceName}
aeOriginator = CDASServer
aeHttpPOA = http://${general:host}:${notifications:port}${notifications:endpoint}

